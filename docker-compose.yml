
services:
  nginx:
    image: nginx:alpine
    container_name: self-healing-nginx
    ports:
      - "8085:80"
    volumes:
      - ./nginx:/usr/share/nginx/html:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: self-healing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - nginx
      - blackbox-exporter
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: self-healing-blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    restart: unless-stopped
  
  alertmanager:
    image: prom/alertmanager:latest
    container_name: self-healing-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped    

  recovery-webhook:
    build:
      context: ./recovery
    container_name: self-healing-recovery
    ports:
      - "5000:5000"
    volumes:
      - ./ansible:/ansible:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
